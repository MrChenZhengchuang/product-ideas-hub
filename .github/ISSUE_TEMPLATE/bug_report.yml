name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请不要在 Issue 中提交密码、Token 或真实用户数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望结果是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动...
        2. 打开...
        3. 点击...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS / Windows / Linux, Node.js, JDK, browser
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      render: shell
