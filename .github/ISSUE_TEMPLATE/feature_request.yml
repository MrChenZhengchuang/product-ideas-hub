name: Feature request
description: 提议一个可复用的新能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望交互、接口或数据结构。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
